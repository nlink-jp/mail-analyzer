# Optional: force output language (e.g. "ja", "en"). A top-level key: it
# must come before the first [table], or TOML reads it as part of that table.
# lang = ""

[gcp]
project  = "your-project-id"
# Gemini 3 models are served only from the global endpoint.
# Set a region (e.g. "us-central1") only when using a Gemini 2.5 model.
location = "global"

[model]
name = "gemini-3.7-flash"

